function wonMonth(k,id){for(var i in k.months)if(k.months[i]&&k.months[i].winner===id)return +i;return -1}
function winners(k){var s={};for(var i in k.months){var w=k.months[i]&&k.months[i].winner;if(w&&w!=='MOD')s[w]=1}return s}
function firstOpen(k){var n=nMonths(k);for(var i=0;i<n;i++){if(!(k.months[i]&&k.months[i].winner))return i}return Math.max(0,n-1)}
function eligible(k){var w=winners(k);return k.members.filter(function(m){return !w[m.id]&&!m.hold})}
function M(k,i){if(!k.months[i])k.months[i]={paid:{}};if(!k.months[i].paid)k.months[i].paid={};return k.months[i]}
function curM(k){var n=nMonths(k);var i=UI.m[k.id];if(i==null||i>=n||i<0)i=firstOpen(k);return i}
function started(k){for(var i in k.months){var m=k.months[i];if(m&&(m.winner||Object.keys(m.paid||{}).length))return true}return false}
function commText(k){return {share:'1 share ('+money(k,k.amount)+') every month',fixed:money(k,k.commValue)+' every month',first:'Full 1st month pot',none:'None'}[k.commMode]||'None'}
function waLink(text,phone){var p=String(phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;return 'https://wa.me/'+(p||'')+'?text='+encodeURIComponent(text)}

function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function openModal(h){modalOpen=true;mroot.innerHTML='<div class="ov" data-a="ovclose"><div class="sheet">'+h+'</div></div>'}
function closeModal(){mroot.innerHTML='';modalOpen=false;if(dirty)schedule(600)}
function confirmBox(title,msg,yes,fn,danger){pending=fn;openModal('<h2>'+esc(title)+'</h2><p class="m">'+msg+'</p><div class="btns mt"><button class="btn s" data-a="close">Cancel</button><button class="btn '+(danger?'r':'p')+'" data-a="yes">'+esc(yes)+'</button></div>')}

/* ---------- views ---------- */
function viewHome(){
  var h='<div class="top"><div class="row1"><div><h1>RKP കുറി</h1><div class="sub">Monthly chit / kuri groups</div></div><span class="pill" id="stat">'+statusText()+'</span></div><button class="lang" data-a="lang">'+(UI.lang==='ml'?'English':'മലയാളം')+'</button></div>';
  if(readOnly)h+='<div class="ro">View only</div>';
  h+='<main>';
  if(!S.kuris.length){h+='<div class="card empty"><div class="e">🪙</div><p><b>No Kuri yet</b><br>Create a Kuri, add 20–30 members, then collect and take the lot every month.</p></div>'}
  S.kuris.forEach(function(k){var done=0;for(var i in k.months)if(k.months[i]&&k.months[i].winner)done++;
    h+='<button class="kcard" data-a="open" data-id="'+k.id+'"><b>'+esc(k.name)+'</b><small>'+money(k,k.amount)+' / month · '+k.members.length+' members · '+done+' of '+nMonths(k)+' months drawn</small></button>'});
  h+='<button class="btn p full" data-a="newKuri">+ '+L('Create new Kuri')+'</button>';
  if(!S.kuris.length)h+='<button class="btn s full mt" data-a="sample">Try with sample data (25 members)</button>';
  h+='<button class="btn s full mt" data-a="importB">Restore from backup</button></main>';
  return h;
}
function header(k){

}
function nav(t){

  return '<nav><div class="in">'+tabs.map(function(x){return '<button class="'+(t===x[0]?'on':'')+'" data-a="tab" data-t="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</div></nav>';
}
function viewMonth(k){
  if(!k.members.length)return '<div class="card empty"><div class="e">👥</div><p><b>'+L('Add members first')+'</b><br>Each member pays '+money(k,k.amount)+' every month.</p><button class="btn p" data-a="tab" data-t="members">'+L('Add members')+'</button></div>';

  // draw
  h+='<div class="card"><h3>'+L('Lot for')+' · '+mLabel(k,i)+'</h3>';
  if(m.winner){
    var methTag=m.method==='lot'?'<span class="tag won meth">'+L('🎲 Won by lot')+'</span>':m.method==='mod'?'<span class="tag ok meth">'+L('👤 Moderator month')+'</span>':'<span class="tag hold meth">'+L('🤝 Assigned on request')+'</span>';
    h+='<div class="winner"><div class="crown">🏆</div><div class="nm">'+esc(wname(k,m.winner))+'</div>'+methTag+'<div class="mut" style="font-size:12px">'+(m.at?new Date(m.at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'')+(m.pool?' · drawn from '+m.pool+' names':'')+'</div></div>';
    if(m.note)h+='<div class="note">📝 '+esc(m.note)+'</div>';
    h+='<div class="it" style="display:flex;align-items:center;gap:10px;padding:12px 0"><button class="chk '+(m.payoutDone?'on':'')+'" data-a="payout">'+(m.payoutDone?'✓':'')+'</button><div class="grow"><b>'+L('Payout handed over')+'</b><small>'+money(k,payoutOf(k,i))+(m.payoutDone&&m.payoutAt?' · '+new Date(m.payoutAt).toLocaleDateString('en-GB'):'')+'</small></div></div>';
    h+='<div class="btns"><a class="btn wa sm" href="'+waLink(shareText(k,i))+'" target="_blank" rel="noopener">'+L('Share on WhatsApp')+'</a><button class="btn s sm" data-a="copyRes">'+L('Copy text')+'</button></div>';
    h+='<button class="btn s full mt sm" data-a="undo" style="color:var(--red)">'+L('Undo this result')+'</button>';
    if(i<n-1)h+='<button class="btn p full mt" data-a="mnext">'+L('Go to')+' '+mLabel(k,i+1)+' ›</button>';

  } else {

    if(pc<N)h+='<div class="warn">'+'⚠️ '+(N-pc)+(UI.lang==='ml'?' ':' member'+(N-pc>1?'s have':' has')+' ')+L('not paid this month yet.')+'</div>';

  }
  h+='</div>';
  // payments
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">'+L('Payments')+' · '+mLabel(k,i)+'</h3><button class="ib" data-a="allPaid">'+(pc===N?L('Clear all'):L('Mark all paid'))+'</button></div><div class="list">';
  k.members.forEach(function(x,ix){var p=paid[x.id];var wm=wonMonth(k,x.id);
    h+='<div class="it"><span class="num">'+(ix+1)+'</span><div class="grow"><b>'+esc(x.name)+'</b><small>'+(p?L('Paid')+' '+(typeof p==='string'?p:''):L('Not paid'))+'</small></div>'+(wm>=0?'<span class="tag won">'+L('Won M')+(wm+1)+'</span>':x.hold?'<span class="tag hold">'+L('Behind')+'</span>':'')+'<button class="chk '+(p?'on':'')+'" data-a="pay" data-id="'+x.id+'" aria-label="Paid">'+(p?'✓':'')+'</button></div>'});
  h+='</div></div>';
  return h;
}
function shareText(k,i){var m=k.months[i]||{},ml=UI.lang==='ml';var t='*'+k.name+'* — '+(ml?'മാസം ':'Month ')+(i+1)+' ('+mLabel(k,i)+')\n';
  if(m.method==='mod')t+=(ml?'👤 നടത്തിപ്പുകാരന്റെ മാസം: ':'👤 Moderator month: ')+(k.moderator||'Moderator')+'\n';
  else t+=(m.method==='lot'?(ml?'🎉 നറുക്ക് കിട്ടിയത്: ':'🎉 Lot winner: '):(ml?'🤝 അഭ്യർത്ഥന പ്രകാരം നൽകിയത്: ':'🤝 Assigned (on request): '))+wname(k,m.winner)+'\n';
  t+=(ml?'ആകെ കുറി തുക: ':'Total pot: ')+money(k,potOf(k))+'\n';if(commOf(k,i)&&m.method!=='mod')t+=(ml?'നടത്തിപ്പുകാരന്റെ വിഹിതം: ':'Moderator share: ')+money(k,commOf(k,i))+'\n';
  if(m.method!=='mod')t+=(ml?'ലഭിക്കുന്ന തുക: ':'Amount to winner: ')+money(k,payoutOf(k,i))+'\n';
  if(i<nMonths(k)-1)t+=ml?'\nഅടുത്ത മാസം: '+mLabel(k,i+1)+'. ദയവായി '+money(k,k.amount)+' സമയത്ത് അടയ്ക്കുക 🙏':'\nNext month: '+mLabel(k,i+1)+'. Please pay '+money(k,k.amount)+' on time 🙏';
  return t}
function viewMembers(k){
  var w=winners(k),h='';
  h+='<div class="card"><h3>'+L('Add member')+'</h3><form data-f="addM"><div class="addrow"><input class="inp" name="name" placeholder="'+L('Name')+'" required autocomplete="off"><input class="inp" name="phone" placeholder="'+L('Phone')+'" inputmode="tel" style="max-width:130px"></div><div class="btns mt"><button class="btn p" type="submit">'+L('+ Add')+'</button><button class="btn s" type="button" data-a="bulk">'+L('Add many')+'</button></div></form>';

  h+='</div></div><p class="mut" style="font-size:12px;padding:0 6px">“Set behind” keeps a member out of the lot until you remove it — for members who asked to take later.</p>';
  return h;

function viewHistory(k){
  var n=nMonths(k),done=0,coll=0,comm=0,out=0,cur=firstOpen(k);
  for(var i=0;i<n;i++){var m=k.months[i];if(!m)continue;var pc=Object.keys(m.paid||{}).filter(function(id){return mem(k,id)}).length;coll+=pc*k.amount;if(m.winner){done++;comm+=commOf(k,i);if(m.method!=='mod'&&m.payoutDone)out+=payoutOf(k,i)}}
  var h='<div class="stats"><div class="stat"><small>'+L('Months drawn')+'</small><b>'+done+' / '+n+'</b></div><div class="stat"><small>'+L('Total collected')+'</small><b>'+money(k,coll)+'</b></div><div class="stat"><small>'+L('Moderator earned')+'</small><b>'+money(k,comm)+'</b></div><div class="stat"><small>'+L('Paid to winners')+'</small><b>'+money(k,out)+'</b></div></div>';
  // dues
  var dues=[];k.members.forEach(function(x){var c=0,ms=[];for(var i=0;i<=cur;i++){var m=k.months[i];if(!(m&&m.paid&&m.paid[x.id])){c++;ms.push(mLabel(k,i))}}if(c)dues.push({x:x,c:c,ms:ms})});
  h+='<div class="card"><h3>'+L('Pending dues')+' ('+(UI.lang==='ml'?mLabel(k,cur)+' '+L('up to'):'up to '+mLabel(k,cur))+')</h3><div class="list">';
  if(!dues.length)h+='<p class="mut tc">'+L('Everyone is up to date ✓')+'</p>';
  dues.forEach(function(d){var txt=UI.lang==='ml'?'നമസ്കാരം '+d.x.name+', *'+k.name+'* — '+d.c+' മാസത്തെ അടവ് ബാക്കിയുണ്ട് ('+d.ms.join(', ')+'). ആകെ '+money(k,d.c*k.amount)+'. ദയവായി വേഗം അടയ്ക്കുക 🙏':'Hi '+d.x.name+', reminder for *'+k.name+'*: '+d.c+' month'+(d.c>1?'s':'')+' pending ('+d.ms.join(', ')+') — total '+money(k,d.c*k.amount)+'. Please pay soon 🙏';
    h+='<div class="it"><div class="grow"><b>'+esc(d.x.name)+'</b><small>'+esc(d.ms.join(', '))+'</small></div><span class="tag due">'+money(k,d.c*k.amount)+'</span><a class="ib" style="background:#e3f6ea;color:#1f7a45;text-decoration:none" href="'+waLink(txt,d.x.phone)+'" target="_blank" rel="noopener">'+L('Remind')+'</a></div>'});
  h+='</div></div>';
  // months
  h+='<div class="card"><h3>'+L('Month by month')+'</h3><div class="list hist">';
  for(var j=0;j<n;j++){var mm=k.months[j]||{};var pcc=Object.keys(mm.paid||{}).filter(function(id){return mem(k,id)}).length;
    h+='<div class="it" data-a="goM" data-i="'+j+'" style="cursor:pointer"><span class="num">'+(j+1)+'</span><div class="grow"><b>'+(mm.winner?esc(wname(k,mm.winner)):'<span class="mut">'+L('Not drawn')+'</span>')+'</b><small>'+mLabel(k,j)+' · '+pcc+'/'+k.members.length+' paid'+(mm.note?' · '+esc(mm.note):'')+'</small></div>'+(mm.winner?(mm.method==='lot'?'<span class="tag won">🎲 '+L('Lot')+'</span>':mm.method==='mod'?'<span class="tag ok">'+L('Moderator')+'</span>':'<span class="tag hold">🤝 '+L('Assigned')+'</span>'):'')+'</div>'}
  h+='</div></div>';
  // waiting
  var w=winners(k),wait=k.members.filter(function(x){return !w[x.id]});
  h+='<div class="card"><h3>'+L('Still waiting')+' ('+wait.length+')</h3><div class="chips">'+(wait.map(function(x){return '<span class="tag '+(x.hold?'hold':'wait')+'">'+(x.hold?'⏸ ':'')+esc(x.name)+'</span>'}).join('')||'<span class="mut">'+L('Everyone has received ✓')+'</span>')+'</div></div>';
  return h;
}

/* ---------- lot ---------- */
function runLot(k,i){
  var el=eligible(k);if(!el.length)return toast('No names in the lot');
  var r=new Uint32Array(1);(window.crypto||window.msCrypto).getRandomValues(r);var win=el[r[0]%el.length];
  modalOpen=true;
  mroot.innerHTML='<div class="lot"><div class="lot-t">'+esc(k.name)+' · '+mLabel(k,i)+'</div><div class="lot-box" id="lotBox"><div id="lotName">🎲</div></div><div class="lot-sub" id="lotSub"'+'>'+L('Drawing from')+' '+el.length+' '+L('names')+'…</div><div id="lotAct"></div></div>';
  var nameEl=document.getElementById('lotName'),delay=45,last=-1;
  function step(){var j;do{j=Math.floor(Math.random()*el.length)}while(el.length>1&&j===last);last=j;nameEl.textContent=el[j].name;delay*=1.075;if(delay<430)setTimeout(step,delay);else setTimeout(reveal,500)}
  function reveal(){
    nameEl.textContent=win.name;document.getElementById('lotBox').className='lot-box win';
    var m=M(k,i);m.winner=win.id;m.method='lot';m.at=Date.now();m.pool=el.length;m.note='';
    var held=k.members.filter(function(x){return x.hold&&!winners(k)[x.id]&&x.id!==win.id});if(held.length)m.note='Set behind (not in lot): '+held.map(function(x){return x.name}).join(', ');
    commit();
    document.getElementById('lotSub').innerHTML='🎉 '+L('Winner of')+' '+mLabel(k,i)+' · '+L('receives')+' <b>'+money(k,payoutOf(k,i))+'</b>';
    document.getElementById('lotAct').innerHTML='<a class="btn wa full" href="'+waLink(shareText(k,i))+'" target="_blank" rel="noopener">'+L('Share on WhatsApp')+'</a><button class="btn s full" data-a="lotDone">'+L('Done')+'</button>';
    confetti();
  }
  setTimeout(step,400);
}
function confetti(){var box=mroot.querySelector('.lot');if(!box)return;var cs=['#f3d27a','#fff','#2fa274','#ff8a65','#7fb3ff'];for(var i=0;i<60;i++){var s=document.createElement('i');s.className='cf';s.style.left=Math.random()*100+'%';s.style.background=cs[i%cs.length];s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(s)}}

/* ---------- actions ---------- */
function guard(){if(readOnly){toast('View only — changes are not allowed');return false}return true}
function act(a,d){
  var k=K();
  switch(a){
  case 'ovclose':return;
  case 'close':closeModal();return;
  case 'yes':var f=pending;pending=null;closeModal();if(f)f();return;
  case 'home':S.activeId=null;saveUI();render();window.scrollTo(0,0);return;
  case 'open':S.activeId=d.id;UI.tab='month';saveUI();render();window.scrollTo(0,0);return;
  case 'tab':UI.tab=d.t;saveUI();render();window.scrollTo(0,0);return;
  case 'mprev':UI.m[k.id]=Math.max(0,curM(k)-1);saveUI();render();return;
  case 'mnext':UI.m[k.id]=Math.min(nMonths(k)-1,curM(k)+1);saveUI();render();window.scrollTo(0,0);return;
  case 'goM':UI.m[k.id]=+d.i;UI.tab='month';saveUI();render();window.scrollTo(0,0);return;
  case 'newKuri':if(!guard())return;openModal('<h2>New Kuri</h2>'+kuriForm(null,true));return;
  case 'sample':if(!guard())return;sample();return;
  case 'copyRes':copy(shareText(k,curM(k)));return;
  case 'copyB':copy(JSON.stringify(S));return;
  case 'importB':if(!guard())return;openModal('<h2>Restore backup</h2><p class="m">Paste the backup text you copied earlier. It replaces all current data.</p><form data-f="imp"><textarea class="inp" name="t" rows="7" required></textarea><div class="btns mt"><button class="btn s" type="button" data-a="close">Cancel</button><button class="btn p" type="submit">Restore</button></div></form>');return;
  case 'lang':UI.lang=UI.lang==='ml'?'en':'ml';saveUI();render();return;
  case 'setLang':UI.lang=d.l;saveUI();render();return;
  case 'lotDone':closeModal();window.scrollTo(0,0);return;
  }
  if(!k||!guard())return;
  var i=curM(k);
  switch(a){
  case 'pay':var m=M(k,i);if(m.paid[d.id])delete m.paid[d.id];else m.paid[d.id]=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'});commit();return;
  case 'allPaid':var m2=M(k,i),all=k.members.every(function(x){return m2.paid[x.id]});
    if(all)confirmBox('Clear all payments?','Unmark every payment for '+mLabel(k,i)+'.','Clear',function(){m2.paid={};commit()},true);
    else{var dt=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'});k.members.forEach(function(x){if(!m2.paid[x.id])m2.paid[x.id]=dt});commit()}return;
  case 'lot':var el=eligible(k);var pp=(k.months[i]&&k.months[i].paid)||{};var pc=k.members.filter(function(x){return pp[x.id]}).length;
    confirmBox('Take the lot for '+mLabel(k,i)+'?',el.length+' names are in the lot'+(pc<k.members.length?' · <b>'+(k.members.length-pc)+' not paid yet</b>':'')+'. The result is saved immediately.','🎲 Start',function(){runLot(k,i)});return;
  case 'assign':var w=winners(k),opts=k.members.filter(function(x){return !w[x.id]});
    if(!opts.length)return toast('Everyone has already received');
    openModal('<h2>Assign '+mLabel(k,i)+'</h2><p class="m">Give this month to a member on request (help / need), without the lot.</p><form data-f="assign"><label class="f">Member</label><select class="inp" name="id" required>'+opts.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+(x.hold?' (behind)':'')+'</option>'}).join('')+'</select><label class="f">Reason / note</label><input class="inp" name="note" placeholder="e.g. Requested for family function"><div class="btns" style="margin-top:16px"><button class="btn s" type="button" data-a="close">Cancel</button><button class="btn p" type="submit">Assign</button></div></form>');return;
  case 'modMonth':var mm=M(k,0);mm.winner='MOD';mm.method='mod';mm.at=Date.now();commit();return;
  case 'undo':confirmBox('Undo result?','Remove <b>'+esc(wname(k,k.months[i].winner))+'</b> as the '+mLabel(k,i)+' result. Payments stay as they are.','Undo',function(){var x=k.months[i];delete x.winner;delete x.method;delete x.at;delete x.pool;delete x.note;delete x.payoutDone;delete x.payoutAt;commit()},true);return;
  case 'payout':var mp=k.months[i];mp.payoutDone=!mp.payoutDone;mp.payoutAt=mp.payoutDone?Date.now():null;commit();return;
  case 'hold':var mh=mem(k,d.id);if(!mh)return;if(mh.hold){mh.hold=false;mh.holdNote='';commit()}else{openModal('<h2>Set '+esc(mh.name)+' behind</h2><p class="m">They will not be in the lot until you remove this. You can still assign a month to them.</p><form data-f="hold" data-id="'+mh.id+'"><label class="f">Note (optional)</label><input class="inp" name="note" placeholder="e.g. Wants to take after Ramadan"><div class="btns" style="margin-top:16px"><button class="btn s" type="button" data-a="close">Cancel</button><button class="btn p" type="submit">Set behind</button></div></form>')}return;
  case 'editM':var me=mem(k,d.id);if(!me)return;openModal('<h2>Edit member</h2><form data-f="editM" data-id="'+me.id+'"><label class="f">Name</label><input class="inp" name="name" required value="'+esc(me.name)+'"><label class="f">Phone</label><input class="inp" name="phone" inputmode="tel" value="'+esc(me.phone||'')+'"><div class="btns" style="margin-top:16px"><button class="btn r" type="button" data-a="delM" data-id="'+me.id+'">Delete</button><button class="btn p" type="submit">Save</button></div></form>');return;
  case 'delM':var md=mem(k,d.id);if(wonMonth(k,d.id)>=0){toast('This member already received — undo that month first');return}
    closeModal();confirmBox('Delete '+md.name+'?','Their payment records will be removed too.','Delete',function(){k.members=k.members.filter(function(x){return x.id!==d.id});for(var j in k.months){if(k.months[j]&&k.months[j].paid)delete k.months[j].paid[d.id]}commit()},true);return;
  case 'bulk':openModal('<h2>Add many members</h2><p class="m">One per line. Add a phone after a comma: <i>Faisal, 9876543210</i></p><form data-f="bulk"><textarea class="inp" name="t" rows="9" required></textarea><div class="btns mt"><button class="btn s" type="button" data-a="close">Cancel</button><button class="btn p" type="submit">Add all</button></div></form>');return;
  case 'delK':confirmBox('Delete '+k.name+'?','All members, payments and lot results of this Kuri will be removed. Copy a backup first if unsure.','Delete Kuri',function(){S.kuris=S.kuris.filter(function(x){return x.id!==k.id});S.activeId=null;commit()},true);return;
  }
}
function copy(t){if(window.__kuriShare){window.__kuriShare(t).catch(function(){showCopy(t)});return}try{navigator.clipboard.writeText(t).then(function(){toast('Copied ✓')},function(){showCopy(t)})}catch(e){showCopy(t)}}
function showCopy(t){openModal('<h2>Copy this text</h2><textarea class="inp" rows="8" readonly onclick="this.select()">'+esc(t)+'</textarea><button class="btn s full mt" data-a="close">Close</button>')}
function readKuri(fd,k){k.name=fd.get('name').trim();k.amount=+fd.get('amount');k.currency=fd.get('currency');k.start=fd.get('start');k.drawDay=+fd.get('drawDay')||'';k.moderator=fd.get('moderator').trim();k.commMode=fd.get('commMode');k.commValue=+fd.get('commValue')||0;return k}
function onSubmit(f){
  var fd=new FormData(f),t=f.dataset.f,k=K();
  if(!guard())return;
  if(t==='newK'){var nk=readKuri(fd,{id:uid(),members:[],months:{},created:Date.now()});S.kuris.push(nk);S.activeId=nk.id;UI.tab='members';saveUI();closeModal();commit();return}
  if(t==='imp'){var o;try{o=JSON.parse(fd.get('t'))}catch(e){return toast('That is not a valid backup')}
    if(o&&o.kuris){S=o}else if(o&&o.members&&o.months){o.id=uid();S.kuris.push(o);S.activeId=o.id}else return toast('That is not a valid backup');
    closeModal();commit();toast('Restored ✓');return}
  if(!k)return;
  var i=curM(k);
  if(t==='editK'){var oldN=k.members.length;readKuri(fd,k);commit();toast('Saved ✓');return}
  if(t==='addM'){var nm=fd.get('name').trim();if(!nm)return;k.members.push({id:uid(),name:nm,phone:fd.get('phone').trim(),hold:false});commit();setTimeout(function(){var x=app.querySelector('[data-f=addM] [name=name]');if(x)x.focus()},30);return}
  if(t==='bulk'){var c=0;fd.get('t').split(/\n/).forEach(function(l){var p=l.split(',');var n=(p[0]||'').trim();if(n){k.members.push({id:uid(),name:n,phone:(p[1]||'').trim(),hold:false});c++}});closeModal();commit();toast(c+' members added');return}
  if(t==='editM'){var m=mem(k,f.dataset.id);m.name=fd.get('name').trim()||m.name;m.phone=fd.get('phone').trim();closeModal();commit();return}
  if(t==='hold'){var mh=mem(k,f.dataset.id);mh.hold=true;mh.holdNote=fd.get('note').trim();closeModal();commit();return}
  if(t==='assign'){var mo=M(k,i),id=fd.get('id'),am=mem(k,id);mo.winner=id;mo.method='assign';mo.at=Date.now();mo.pool=0;mo.note=fd.get('note').trim();if(am){am.hold=false}closeModal();commit();toast(am.name+' assigned for '+mLabel(k,i));return}
}
function sample(){
  var names=['Abdul Rahman','Shameer K','Faisal P','Muhammed Ali','Ashraf V','Noushad','Jaseem','Rasheed','Sajid','Anwar','Haris','Shafeeq','Riyas','Nizar','Salim','Basheer','Junaid','Irshad','Fasil','Hakeem','Unais','Jabir','Mansoor','Nazeer','Sidheeq'];
  var k={id:uid(),name:'Sample Kuri 2026',amount:5000,currency:'₹',start:new Date().toISOString().slice(0,7),drawDay:5,moderator:'Moderator',commMode:'share',commValue:0,months:{},created:Date.now(),
    members:names.map(function(n,ix){return {id:uid(),name:n,phone:'',hold:false}})};
  S.kuris.push(k);S.activeId=k.id;UI.tab='month';saveUI();commit();
}

app.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.tagName==='A')return;e.preventDefault();act(t.dataset.a,t.dataset)});
