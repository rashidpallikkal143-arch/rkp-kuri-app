function schedule(ms){if(!artifact||readOnly||SY.code)return;clearTimeout(timer);timer=setTimeout(flush,ms||1800)}
function flush(){
  if(!dirty||!artifact||readOnly||saving)return;
  if(modalOpen)return;
  saving=true;dirty=false;saveUI();try{sessionStorage.setItem('kuri-scroll',String(window.scrollY||0))}catch(e){}updStatus();
  artifact.publish(buildHTML()).then(function(){saving=false;updStatus()},function(e){
    saving=false;var c=(e&&e.code)||'upstream_error';
    if(c==='conflict'){return}

    else if(c==='rate_limited'){dirty=true;schedule(10000)}
    else{dirty=true;toast('Could not save online. Kept on this device — retrying.');schedule(8000)}
    updStatus();
  });
}

function L(x){return UI.lang==='ml'&&ML[x]||x}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(k,v){var loc=k.currency==='₹'?'en-IN':'en-US';return (k.currency||'')+Math.round(v||0).toLocaleString(loc)}
function K(){for(var i=0;i<S.kuris.length;i++)if(S.kuris[i].id===S.activeId)return S.kuris[i];return null}
function nMonths(k){return k.members.length+(k.commMode==='first'?1:0)}
function mDate(k,i){var p=(k.start||'2026-01').split('-');return new Date(+p[0],+p[1]-1+i,1)}
function mLabel(k,i){return mDate(k,i).toLocaleString('en-US',{month:'short',year:'numeric'})}
function drawDate(k,i){var d=mDate(k,i);if(k.drawDay)d.setDate(Math.min(+k.drawDay,28));return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function potOf(k){return (+k.amount||0)*k.members.length}
function commOf(k,i){if(k.commMode==='first')return i===0?potOf(k):0;if(k.commMode==='share')return +k.amount||0;if(k.commMode==='fixed')return +k.commValue||0;return 0}
function payoutOf(k,i){return potOf(k)-commOf(k,i)}
function mem(k,id){for(var i=0;i<k.members.length;i++)if(k.members[i].id===id)return k.members[i];return null}
function wname(k,id){if(id==='MOD')return (k.moderator||'Moderator')+' (Moderator)';var m=mem(k,id);return m?m.name:'(removed member)'}
function wonMonth(k,id){for(var i in k.months)if(k.months[i]&&k.months[i].winner===id)return +i;return -1}
function winners(k){var s={};for(var i in k.months){var w=k.months[i]&&k.months[i].winner;if(w&&w!=='MOD')s[w]=1}return s}
function firstOpen(k){var n=nMonths(k);for(var i=0;i<n;i++){if(!(k.months[i]&&k.months[i].winner))return i}return Math.max(0,n-1)}
function eligible(k){var w=winners(k);return k.members.filter(function(m){return !w[m.id]&&!m.hold})}
function M(k,i){if(!k.months[i])k.months[i]={paid:{}};if(!k.months[i].paid)k.months[i].paid={};return k.months[i]}
function curM(k){var n=nMonths(k);var i=UI.m[k.id];if(i==null||i>=n||i<0)i=firstOpen(k);return i}
function started(k){for(var i in k.months){var m=k.months[i];if(m&&(m.winner||Object.keys(m.paid||{}).length))return true}return false}
function commText(k){return {share:'1 share ('+money(k,k.amount)+') every month',fixed:money(k,k.commValue)+' every month',first:'Full 1st month pot',none:'None'}[k.commMode]||'None'}
function waLink(text,phone){var p=String(phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;return 'https://wa.me/'+(p||'')+'?text='+encodeURIComponent(text)}

function stmtData(k,x){

function runLot(k,i){
  var el=eligible(k);if(!el.length)return toast('No names in the lot');
  var r=new Uint32Array(1);(window.crypto||window.msCrypto).getRandomValues(r);var win=el[r[0]%el.length];

  var faces=[];while(faces.length<16||faces.length<el.length){el.forEach(function(x){faces.push(x)})}
  if(faces.length>40)faces=faces.slice(0,Math.max(el.length,16));

  var winIdx=[];faces.forEach(function(x,j){if(x.id===win.id)winIdx.push(j)});

  modalOpen=true;
  var fh='';faces.forEach(function(x,j){fh+='<div class="face" style="transform:rotateX('+(-j*step)+'deg) translateZ('+R+'px)"><span>'+esc(x.name)+'</span></div>'});
  mroot.innerHTML='<div class="lot"><div class="lot-t">'+esc(k.name)+' · '+mLabel(k,i)+'</div>'+
    '<div class="drumframe" style="height:'+Math.min(2*R+20,330)+'px"><div class="drumwrap" id="drumwrap"><div class="drumbody"><div class="drum" id="drum" style="height:'+H+'px;margin-top:-'+(H/2)+'px">'+fh+'</div></div></div><div class="drumshade"></div><div class="drumwin" style="height:'+(H+8)+'px;margin-top:-'+(H/2+4)+'px"></div><div class="ptr l"></div><div class="ptr r"></div></div>'+
    '<div class="lot-sub" id="lotSub">'+L('Drawing from')+' '+el.length+' '+L('names')+'…</div>'+
    '<div class="wcard" id="wcard"><div class="wcin"><div class="wf wfront">?</div><div class="wf wback"><small>🏆 '+L('Winner of')+' '+mLabel(k,i)+'</small><b id="wname"></b><span id="wamt"></span></div></div></div>'+
    '<div id="lotAct"></div></div>';
  var drum=document.getElementById('drum');
  // motion: ramp up 1.2s, cruise 2.8s, slow down 6s
  var a=1.2,c=2.8,d=6,T=a+c+d,target=tIdx*step,turns=8,D=turns*360+target+(Math.random()*.0),vmax=D/(a/2+c+d/3);
  function pos(t){if(t<=0)return 0;if(t<a)return vmax*t*t/(2*a);if(t<a+c)return vmax*(a/2+(t-a));if(t<T){var u=(t-a-c)/d;return vmax*(a/2+c+d*(1-Math.pow(1-u,3))/3)}return D}

  function frame(ts){if(!document.getElementById('drum'))return;if(t0===null)t0=ts;var t=(ts-t0)/1000,ang=pos(t);
    drum.style.transform='translateZ(-'+R+'px) rotateX('+ang+'deg)';var vel=t>lastT?(ang-lastA)/(t-lastT):0;lastA=ang;lastT=t;if(wrapEl)wrapEl.style.filter=vel>150?'blur('+Math.min(2.2,(vel-150)/220).toFixed(2)+'px)':'none';
    var f=Math.round(ang/step);if(f!==lastFace){lastFace=f;beep(t<T-1.5?1400:1100,.03,t<T-1.5?.03:.06);try{if(navigator.vibrate&&t>T-3)navigator.vibrate(8)}catch(e){}}
    if(t<T)requestAnimationFrame(frame);else setTimeout(reveal,350)}
  // drum roll start
  beep(220,.25,.04,'sawtooth');setTimeout(function(){requestAnimationFrame(frame)},350);
  function reveal(){
    var fronts=drum.querySelectorAll('.face');if(fronts[tIdx])fronts[tIdx].className='face win';
    var m=M(k,i);UI.m[k.id]=i;saveUI();m.winner=win.id;m.method='lot';addLog(k,'🎲 Lot winner: '+win.name+' · '+mLabel(k,i));m.at=Date.now();m.pool=el.length;m.drawNames=el.map(function(x){return x.name});m.note='';
    var held=k.members.filter(function(x){return x.hold&&!winners(k)[x.id]&&x.id!==win.id});if(held.length)m.note='Set behind (not in lot): '+held.map(function(x){return x.name}).join(', ');
    commit();
    setTimeout(function(){
      var wc=document.getElementById('wcard');if(!wc)return;
      document.getElementById('wname').textContent=win.name;document.getElementById('wamt').textContent=money(k,payoutOf(k,i));
      wc.className='wcard show';setTimeout(function(){wc.className='wcard show flip'},450);

      setTimeout(function(){confetti();document.getElementById('lotAct').innerHTML='<button class="btn gold full" data-a="video">🎬 '+L('Make lot video')+'</button><a class="btn wa full" href="'+waLink(shareText(k,i))+'" target="_blank" rel="noopener">'+L('Share on WhatsApp')+'</a><button class="btn s full" data-a="lotDone">'+L('Done')+'</button>'},1100);
    },700);

  if(!k||!guard())return;

  case 'hold':var mh=mem(k,d.id);if(!mh)return;if(modalOpen)closeModal();if(mh.hold){mh.hold=false;mh.holdNote='';addLog(k,'Removed hold: '+mh.name);commit()}else{openModal('<h2>Set '+esc(mh.name)+' behind</h2><p class="m">They will not be in the lot until you remove this. You can still assign a month to them.</p><form data-f="hold" data-id="'+mh.id+'"><label class="f">Note (optional)</label><input class="inp" name="note" placeholder="e.g. Wants to take after Ramadan"><div class="btns" style="margin-top:16px"><button class="btn s" type="button" data-a="close">Cancel</button><button class="btn p" type="submit">Set behind</button></div></form>')}return;

function copy(t){if(window.__kuriShare){window.__kuriShare(t).catch(function(){showCopy(t)});return}try{navigator.clipboard.writeText(t).then(function(){toast('Copied ✓')},function(){showCopy(t)})}catch(e){showCopy(t)}}
function showCopy(t){openModal('<h2>Copy this text</h2><textarea class="inp" rows="8" readonly onclick="this.select()">'+esc(t)+'</textarea><button class="btn s full mt" data-a="close">Close</button>')}
function readKuri(fd,k){k.name=fd.get('name').trim();k.amount=+fd.get('amount');k.currency=fd.get('currency');k.start=fd.get('start');k.drawDay=+fd.get('drawDay')||'';k.moderator=fd.get('moderator').trim();k.commMode=fd.get('commMode');k.commValue=+fd.get('commValue')||0;return k}
function onSubmit(f){
  var fd=new FormData(f),t=f.dataset.f,k=K();
  if(t!=='liveNew'&&t!=='liveJoin'&&!guard())return;
  if(t==='liveNew'){closeModal();liveCreate(fd.get('name').trim());return}
  if(t==='liveJoin'){liveJoin(fd.get('code'),fd.get('name').trim());return}
  if(t==='newK'){var nk=readKuri(fd,{id:uid(),members:[],months:{},created:Date.now()});S.kuris.push(nk);S.activeId=nk.id;addLog(nk,'Created Kuri: '+nk.name);UI.tab='members';saveUI();closeModal();commit();return}
  if(t==='imp'){var o;try{o=JSON.parse(fd.get('t'))}catch(e){return toast('That is not a valid backup')}
    if(o&&o.kuris){S=o}else if(o&&o.members&&o.months){o.id=uid();S.kuris.push(o);S.activeId=o.id}else return toast('That is not a valid backup');
    closeModal();commit();toast('Restored ✓');return}
  if(!k)return;
  var i=curM(k);
  if(t==='editK'){readKuri(fd,k);addLog(k,'Edited Kuri details');commit();toast('Saved ✓');return}
  if(t==='addM'){var nm=fd.get('name').trim();if(!nm)return;k.members.push({id:uid(),name:nm,phone:fd.get('phone').trim(),hold:false});addLog(k,'Added member: '+nm);commit();setTimeout(function(){var x=app.querySelector('[data-f=addM] [name=name]');if(x)x.focus()},30);return}
  if(t==='bulk'){var c=0;fd.get('t').split(/\n/).forEach(function(l){var p=l.split(',');var n=(p[0]||'').trim();if(n){k.members.push({id:uid(),name:n,phone:(p[1]||'').trim(),hold:false});c++}});addLog(k,'Added '+c+' members');closeModal();commit();toast(c+' members added');return}
  if(t==='editM'){var m=mem(k,f.dataset.id),old=m.name;m.name=fd.get('name').trim()||m.name;m.phone=fd.get('phone').trim();addLog(k,'Edited member: '+(old!==m.name?old+' → ':'')+m.name);closeModal();var no=parseInt(fd.get('no'),10);if(no&&no-1!==k.members.indexOf(m)){moveMember(k,m.id,no-1)}else commit();return}
  if(t==='ordM'){var no2=parseInt(fd.get('no'),10);closeModal();if(no2)moveMember(k,f.dataset.id,no2-1);return}
  if(t==='hold'){var mh=mem(k,f.dataset.id);mh.hold=true;mh.holdNote=fd.get('note').trim();addLog(k,'Set behind: '+mh.name+(mh.holdNote?' ('+mh.holdNote+')':''));closeModal();commit();return}
  if(t==='assign'){UI.m[k.id]=i;saveUI();var mo=M(k,i),id=fd.get('id'),am=mem(k,id);mo.winner=id;mo.method='assign';mo.at=Date.now();mo.pool=0;mo.note=fd.get('note').trim();if(am){am.hold=false}addLog(k,'🤝 Assigned: '+(am?am.name:'')+' · '+mLabel(k,i)+(mo.note?' ('+mo.note+')':''));closeModal();commit();toast(am.name+' assigned for '+mLabel(k,i));return}
}
